name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/task-manager-API"

          echo "Entrando al proyecto..."
          cd "$APP_DIR"

          echo "Guardando commit actual..."
          PREVIOUS_COMMIT=$(git rev-parse HEAD)

          echo "Descargando cambios desde el repositorio..."
          git fetch origin main
          git reset --hard origin/main

          echo "Instalando dependencias..."
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

          echo "Reiniciando el servicio..."
          sudo systemctl restart task-manager-api

          echo "Esperando el arranque del servicio..."
          sleep 5

          echo "Verificando el estado del servicio..."
          if ! sudo systemctl is-active --quiet task-manager-api; then
            echo "El servicio falló. Ejecutando rollback al commit anterior..."

            git reset --hard "$PREVIOUS_COMMIT"
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart task-manager-api

            exit 1
          fi

          echo "Verificando API..."
          if ! curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/docs \
            > /dev/null; then

            echo "La API no responde. Ejecutando rollback..."

            git reset --hard "$PREVIOUS_COMMIT"
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart task-manager-api

            exit 1
          fi

          echo "Despliegue completado con éxito."
          REMOTE_SCRIPT

      - name: Verify public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            "http://$EC2_HOST/docs" \
            > /dev/null